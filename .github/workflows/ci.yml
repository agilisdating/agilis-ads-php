name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Coding standard
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: '1'

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit

  integration:
    name: Test-mode run
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check for a Test key
        id: key
        env:
          AGILIS_TEST_API_KEY: ${{ secrets.AGILIS_TEST_API_KEY }}
        run: |
          if [ -z "$AGILIS_TEST_API_KEY" ]; then
            echo "No AGILIS_TEST_API_KEY secret: skipping the Test-mode run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [ "${AGILIS_TEST_API_KEY#pk_live_}" != "$AGILIS_TEST_API_KEY" ]; then
            echo "::error::AGILIS_TEST_API_KEY is a Live key. The Test-mode run only uses pk_test_ keys."
            exit 1
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: shivammathur/setup-php@v2
        if: steps.key.outputs.present == 'true'
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Integration tests
        if: steps.key.outputs.present == 'true'
        env:
          AGILIS_TEST_API_KEY: ${{ secrets.AGILIS_TEST_API_KEY }}
        run: vendor/bin/phpunit --testsuite integration
